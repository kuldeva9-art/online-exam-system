<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ExamFlow Pro - Modern, secure, role-based online examination portal with instant auto-grading, proctoring, and certification.">
    <title>ExamFlow Pro - Online Examination System</title>
    
    <style>
/* ==========================================================================
   ExamFlow Design System & Styling (All-in-One Bundled)
   Ultra-modern Glassmorphism, Dynamic Gradients & Responsive Exam Engine
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
    /* Color Palette */
    --bg-main: #0a0d14;
    --bg-surface: #111622;
    --bg-surface-elevated: #182030;
    --bg-glass: rgba(17, 22, 34, 0.75);
    --bg-glass-card: rgba(24, 32, 48, 0.6);
    --bg-glass-input: rgba(10, 13, 20, 0.6);

    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(99, 102, 241, 0.35);
    --border-focus: #6366f1;

    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --text-dim: #475569;

    /* Accent & Brand Colors */
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-glow: rgba(99, 102, 241, 0.25);
    
    --secondary: #8b5cf6;
    --success: #10b981;
    --success-glow: rgba(16, 185, 129, 0.2);
    --warning: #f59e0b;
    --warning-glow: rgba(245, 158, 11, 0.2);
    --danger: #ef4444;
    --danger-glow: rgba(239, 68, 68, 0.25);
    --info: #06b6d4;

    /* Typography & Spacing */
    --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;
    --radius-full: 9999px;

    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
    --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.2);

    --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Reset & Base Setup */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100vh;
    font-family: var(--font-main);
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

/* Background Ambient Glow */
body::before {
    content: '';
    position: fixed;
    top: -150px;
    left: 20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 70%);
    z-index: -1;
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed;
    bottom: -150px;
    right: 10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, rgba(16, 185, 129, 0.03) 50%, transparent 70%);
    z-index: -1;
    pointer-events: none;
}

/* App Views Management */
.app-view {
    display: none;
    width: 100%;
    min-height: 100vh;
}

.app-view.active {
    display: block;
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   NAVIGATION BAR
   ========================================================================== */

.main-navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 2rem;
    background: var(--bg-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none;
}

.brand-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-md);
    box-shadow: 0 4px 12px var(--primary-glow);
    font-size: 1.2rem;
}

.nav-user-area {
    display: flex;
    align-items: center;
    gap: 1.5rem;
}

.nav-demo-switch {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--bg-surface-elevated);
    padding: 0.25rem 0.5rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-subtle);
}

.nav-demo-switch .active-role {
    background: var(--primary);
    color: #fff;
    font-weight: 600;
}

.user-profile-menu {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.avatar-sm {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-full);
    object-fit: cover;
    border: 2px solid var(--border-subtle);
}

.user-info-text {
    display: flex;
    flex-direction: column;
}

.user-name-text {
    font-size: 0.85rem;
    font-weight: 600;
}

.user-role-badge {
    font-size: 0.7rem;
}

/* ==========================================================================
   AUTH SCREEN (LOGIN / REGISTER)
   ========================================================================== */

.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.auth-card {
    width: 100%;
    max-width: 460px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(20px);
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-header .brand-icon {
    margin: 0 auto 1rem auto;
    width: 48px;
    height: 48px;
    font-size: 1.5rem;
}

.auth-title {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.auth-subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-top: 0.35rem;
}

.auth-tabs {
    display: flex;
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-md);
    padding: 0.25rem;
    margin-bottom: 1.75rem;
    border: 1px solid var(--border-subtle);
}

.auth-tab-btn {
    flex: 1;
    padding: 0.6rem;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.85rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
}

.auth-tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px var(--primary-glow);
}

.demo-credentials-box {
    margin-top: 1.75rem;
    padding: 1rem;
    background: rgba(99, 102, 241, 0.08);
    border: 1px dashed var(--border-glow);
    border-radius: var(--radius-md);
}

.demo-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--primary);
    margin-bottom: 0.5rem;
}

.demo-buttons-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
}

/* ==========================================================================
   PORTAL LAYOUTS (ADMIN, TEACHER, STUDENT)
   ========================================================================== */

.portal-container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 2.5rem 2rem;
}

.portal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.portal-title {
    font-size: 1.85rem;
    font-weight: 800;
    letter-spacing: -0.02em;
}

.portal-subtitle {
    color: var(--text-secondary);
    font-size: 0.95rem;
    margin-top: 0.25rem;
}

.portal-actions {
    display: flex;
    gap: 0.75rem;
}

/* Tabs Navigation */
.tabs-nav {
    display: flex;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 1.75rem;
    overflow-x: auto;
    padding-bottom: 2px;
}

.tab-btn {
    padding: 0.75rem 1.25rem;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: var(--transition);
    white-space: nowrap;
}

.tab-btn:hover {
    color: var(--text-primary);
}

.tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

/* ==========================================================================
   CARDS & GRIDS
   ========================================================================== */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.25rem;
}

.stat-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    transition: var(--transition);
}

.stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-glow);
    box-shadow: var(--shadow-sm);
}

.stat-icon {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
}

.bg-indigo { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
.bg-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; }
.bg-cyan { background: rgba(6, 182, 212, 0.15); color: #22d3ee; }
.bg-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

.stat-value {
    font-size: 1.75rem;
    font-weight: 800;
    line-height: 1.1;
}

.stat-label {
    font-size: 0.825rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
}

.grid-2col {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
}

.card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

.card-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
}

.card-title {
    font-size: 1.1rem;
    font-weight: 700;
}

.card-subtitle {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 0.15rem;
}

.card-body {
    padding: 1.5rem;
}

/* ==========================================================================
   EXAMS GRID & CARDS
   ========================================================================== */

.exams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.5rem;
}

.exam-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: var(--transition);
}

.exam-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-glow);
    box-shadow: var(--shadow-glow);
}

.exam-card-badge {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
}

.subject-tag {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    background: rgba(99, 102, 241, 0.15);
    color: #a5b4fc;
    border-radius: var(--radius-sm);
}

.exam-card-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    line-height: 1.3;
}

.exam-card-desc {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.exam-card-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    background: var(--bg-surface-elevated);
    padding: 0.85rem;
    border-radius: var(--radius-md);
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
}

.exam-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border-subtle);
    padding-top: 1rem;
}

/* Subjects Grid */
.subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
}

.subject-card {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.subject-icon-box {
    width: 46px;
    height: 46px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
}

.subject-code {
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--primary);
    font-weight: 600;
}

.subject-desc {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
}

.subject-stats {
    display: flex;
    gap: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
}

/* ==========================================================================
   TABLES
   ========================================================================== */

.table-responsive {
    width: 100%;
    overflow-x: auto;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
    text-align: left;
}

.data-table th {
    padding: 0.85rem 1rem;
    background: var(--bg-surface-elevated);
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border-subtle);
}

.data-table td {
    padding: 1rem;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-primary);
    vertical-align: middle;
}

.data-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.02);
}

.user-cell {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.user-name {
    font-weight: 600;
}

.user-sub {
    font-size: 0.75rem;
    color: var(--text-secondary);
}

.action-buttons {
    display: flex;
    gap: 0.35rem;
}

/* ==========================================================================
   QUESTION BANK ITEMS
   ========================================================================== */

.questions-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.question-item {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 1.25rem;
}

.question-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
}

.question-badges {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.question-text {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
}

.options-preview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.5rem;
}

.option-pill {
    padding: 0.5rem 0.75rem;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    font-size: 0.825rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.option-pill.correct {
    border-color: var(--success);
    background: rgba(16, 185, 129, 0.1);
    color: #34d399;
}

.opt-label {
    font-weight: 700;
    color: var(--text-muted);
}

.check-icon {
    margin-left: auto;
    font-weight: 700;
}

.question-explanation {
    margin-top: 0.85rem;
    padding: 0.6rem 0.85rem;
    background: rgba(245, 158, 11, 0.08);
    border-left: 3px solid var(--warning);
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    color: #fde68a;
}

/* ==========================================================================
   LIVE EXAM ROOM & PROCTORING INTERFACE
   ========================================================================== */

.exam-room-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #080b11;
}

.exam-room-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: #0d121c;
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 100;
}

.exam-logo {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--primary);
}

.exam-room-title {
    font-size: 1.15rem;
    font-weight: 700;
}

.exam-timer-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg-surface-elevated);
    padding: 0.5rem 1.25rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-subtle);
}

.timer-digits {
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
}

.timer-digits.timer-danger {
    color: var(--danger);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.proctor-warning-banner {
    background: var(--danger);
    color: #fff;
    padding: 0.65rem 2rem;
    font-size: 0.875rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from { transform: translateY(-100%); }
    to { transform: translateY(0); }
}

.exam-room-body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
}

.exam-main-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.exam-q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
}

.exam-q-number {
    font-size: 1.1rem;
    color: var(--text-secondary);
}

.exam-q-number strong {
    color: var(--text-primary);
    font-size: 1.3rem;
}

.exam-q-prompt {
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 1.5rem;
}

.options-container {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.option-choice-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    background: var(--bg-surface-elevated);
    border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: var(--transition);
}

.option-choice-card:hover {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.05);
}

.option-choice-card.selected {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.15);
    box-shadow: 0 0 15px var(--primary-glow);
}

.choice-prefix {
    width: 28px;
    height: 28px;
    border-radius: var(--radius-sm);
    background: var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.option-choice-card.selected .choice-prefix {
    background: var(--primary);
    color: #fff;
}

.choice-text {
    font-size: 0.95rem;
    flex: 1;
}

.tf-choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.tf-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.75rem;
    background: var(--bg-surface-elevated);
    border: 2px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    transition: var(--transition);
}

.tf-btn:hover {
    border-color: var(--primary);
}

.tf-btn.selected {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.15);
    box-shadow: 0 0 20px var(--primary-glow);
}

.tf-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
}

.exam-q-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border-subtle);
    padding-top: 1.5rem;
    margin-top: 2rem;
}

.exam-nav-buttons {
    display: flex;
    gap: 0.75rem;
}

/* Sidebar Question Palette */
.exam-sidebar-panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.palette-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 1.5rem;
}

.palette-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
}

.palette-header h3 {
    font-size: 1rem;
    font-weight: 700;
}

.palette-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.5rem;
}

.palette-btn {
    height: 42px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-elevated);
    color: var(--text-primary);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: var(--transition);
}

.palette-btn:hover {
    border-color: var(--primary);
}

.palette-btn.palette-answered {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
}

.palette-btn.palette-flagged {
    background: var(--warning);
    color: #000;
    border-color: var(--warning);
}

.palette-btn.palette-current {
    box-shadow: 0 0 0 2px #fff;
    transform: scale(1.05);
}

.palette-legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-top: 1.5rem;
    border-top: 1px solid var(--border-subtle);
    padding-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: var(--radius-full);
}

.dot-answered { background: var(--success); }
.dot-flagged { background: var(--warning); }
.dot-unanswered { background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); }
.dot-current { background: #fff; }

/* ==========================================================================
   SCORECARD & RESULTS
   ========================================================================== */

.score-badge-circle {
    width: 130px;
    height: 130px;
    border-radius: var(--radius-full);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-lg);
}

.score-badge-circle.score-pass {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
    border: 3px solid var(--success);
    box-shadow: 0 0 30px var(--success-glow);
}

.score-badge-circle.score-fail {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
    border: 3px solid var(--danger);
    box-shadow: 0 0 30px var(--danger-glow);
}

.score-number {
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 1;
}

.score-status {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    margin-top: 0.25rem;
}

.score-details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
}

.score-detail-box {
    background: var(--bg-surface-elevated);
    padding: 0.85rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
}

.score-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
}

.score-val {
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 0.2rem;
}

.congrats-banner {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid var(--success);
    color: #34d399;
    padding: 1rem;
    border-radius: var(--radius-md);
    font-weight: 600;
}

.fail-banner {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid var(--danger);
    color: #f87171;
    padding: 1rem;
    border-radius: var(--radius-md);
    font-weight: 600;
}

/* Paper Solution Reviews */
.review-questions-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.review-item {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 1.25rem;
}

.review-item.item-correct {
    border-left: 4px solid var(--success);
}

.review-item.item-incorrect {
    border-left: 4px solid var(--danger);
}

.review-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
}

.review-q-text {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
}

.review-answers-box {
    background: var(--bg-surface);
    padding: 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
}

.review-explanation {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: #fbbf24;
}

/* ==========================================================================
   OFFICIAL CERTIFICATE TEMPLATE
   ========================================================================== */

.certificate-container {
    background: #0f172a;
    color: #f8fafc;
    padding: 1.5rem;
    border-radius: var(--radius-lg);
}

.certificate-border {
    border: 3px double #d4af37;
    padding: 1rem;
    border-radius: var(--radius-md);
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
}

.certificate-inner {
    border: 1px solid rgba(212, 175, 55, 0.4);
    padding: 2.5rem 2rem;
    text-align: center;
}

.cert-logo {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #d4af37;
    text-transform: uppercase;
}

.cert-main-title {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #fff;
    margin: 0.75rem 0 0.25rem 0;
}

.cert-subtitle {
    font-size: 0.9rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.cert-recipient {
    font-size: 2.2rem;
    font-weight: 800;
    font-style: italic;
    color: #38bdf8;
    margin: 1.5rem 0;
    text-decoration: underline;
    text-underline-offset: 8px;
}

.cert-body-text {
    font-size: 1rem;
    color: #cbd5e1;
    max-width: 600px;
    margin: 0 auto 1.5rem auto;
    line-height: 1.6;
}

.cert-exam-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #fbbf24;
    margin: 0.35rem 0;
}

.cert-metrics {
    display: inline-flex;
    gap: 2rem;
    padding: 0.6rem 1.5rem;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-full);
    font-size: 0.85rem;
    margin-bottom: 2rem;
}

.cert-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.cert-sig-block {
    text-align: center;
}

.cert-sig-line {
    font-weight: 700;
    font-size: 0.95rem;
    border-bottom: 1px solid #94a3b8;
    padding-bottom: 0.25rem;
    min-width: 160px;
}

.cert-sig-title {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-top: 0.25rem;
}

.cert-seal {
    width: 70px;
    height: 70px;
    border-radius: var(--radius-full);
    border: 2px dashed #d4af37;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d4af37;
    font-size: 0.6rem;
    font-weight: 800;
    text-align: center;
    line-height: 1.2;
}

/* ==========================================================================
   WIZARD STEPPER
   ========================================================================== */

.wizard-stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    background: var(--bg-surface-elevated);
    border-bottom: 1px solid var(--border-subtle);
}

.step-dot {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
}

.step-dot.active {
    color: var(--primary);
    font-weight: 700;
}

.step-line {
    flex: 1;
    height: 2px;
    background: var(--border-subtle);
    margin: 0 0.75rem;
}

.step-line.active {
    background: var(--primary);
}

.step-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 1.25rem;
}

.wizard-questions-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 0.5rem;
}

.wizard-q-item {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem;
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
}

.wizard-q-item.selected {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.1);
}

.wizard-q-content {
    flex: 1;
}

.wizard-q-text {
    font-size: 0.9rem;
    font-weight: 600;
}

.summary-box {
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 0.4rem;
}

/* ==========================================================================
   FORM CONTROLS & BUTTONS
   ========================================================================== */

.form-group {
    margin-bottom: 1.25rem;
}

.form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--text-primary);
}

.form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--bg-glass-input);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.9rem;
    transition: var(--transition);
}

.form-input:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--primary-glow);
}

.form-input-sm {
    padding: 0.45rem 0.75rem;
    font-size: 0.8rem;
}

.form-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
    display: block;
}

.code-box {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    background: #000;
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.7rem 1.25rem;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: var(--transition);
    text-decoration: none;
    white-space: nowrap;
}

.btn:active {
    transform: scale(0.98);
}

.btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px var(--primary-glow);
}

.btn-primary:hover {
    background: var(--primary-hover);
    box-shadow: 0 6px 16px var(--primary-glow);
}

.btn-secondary {
    background: var(--bg-surface-elevated);
    border-color: var(--border-subtle);
    color: var(--text-primary);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
}

.btn-success {
    background: var(--success);
    color: #fff;
    box-shadow: 0 4px 12px var(--success-glow);
}

.btn-danger {
    background: var(--danger);
    color: #fff;
    box-shadow: 0 4px 12px var(--danger-glow);
}

.btn-ghost {
    background: transparent;
    color: var(--text-secondary);
}

.btn-ghost:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
}

.btn-ghost-danger {
    background: transparent;
    color: #f87171;
}

.btn-ghost-danger:hover {
    background: rgba(239, 68, 68, 0.1);
}

.btn-ghost-warning {
    background: transparent;
    color: #fbbf24;
}

.btn-flagged {
    background: rgba(245, 158, 11, 0.2);
    border-color: var(--warning);
}

.btn-sm {
    padding: 0.45rem 0.85rem;
    font-size: 0.8rem;
}

.btn-xs {
    padding: 0.3rem 0.6rem;
    font-size: 0.75rem;
    border-radius: var(--radius-sm);
}

.btn-lg {
    padding: 0.9rem 1.75rem;
    font-size: 1rem;
}

.btn-full {
    width: 100%;
}

/* Badges */
.badge {
    display: inline-flex;
    align-items: center;
    padding: 0.2rem 0.55rem;
    border-radius: var(--radius-full);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.03em;
}

.badge-primary { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
.badge-secondary { background: rgba(255, 255, 255, 0.1); color: #cbd5e1; }
.badge-success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
.badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; }
.badge-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
.badge-info { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }
.badge-indigo { background: rgba(99, 102, 241, 0.25); color: #c7d2fe; }

/* Modals */
.modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 1000;
    animation: fadeIn 0.2s ease-out;
}

.modal-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    width: 100%;
    max-width: 520px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
}

.modal-lg {
    max-width: 780px;
}

.modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-title {
    font-size: 1.2rem;
    font-weight: 700;
}

.modal-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.2rem;
}

.modal-close:hover {
    color: var(--text-primary);
}

.modal-body {
    padding: 1.5rem;
    overflow-y: auto;
    flex: 1;
}

.modal-footer {
    padding: 1.25rem 1.5rem;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.75rem;
}

/* Toast Notifications */
.toast-container {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    z-index: 9999;
}

.toast {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 0.85rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: var(--shadow-lg);
    animation: toastSlide 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 280px;
    max-width: 400px;
}

@keyframes toastSlide {
    from { opacity: 0; transform: translateX(100%); }
    to { opacity: 1; transform: translateX(0); }
}

.toast.fade-out {
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.3s ease;
}

.toast-success { border-left: 4px solid var(--success); }
.toast-error { border-left: 4px solid var(--danger); }
.toast-warning { border-left: 4px solid var(--warning); }
.toast-info { border-left: 4px solid var(--info); }

/* Empty States */
.empty-state {
    text-align: center;
    padding: 4rem 2rem;
    background: var(--bg-surface);
    border: 1px dashed var(--border-subtle);
    border-radius: var(--radius-lg);
}

.empty-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

/* Helpers */
.text-xs { font-size: 0.75rem; }
.text-sm { font-size: 0.875rem; }
.text-2xl { font-size: 1.5rem; }
.text-muted { color: var(--text-secondary); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warning { color: var(--warning); }
.mt-1 { margin-top: 0.25rem; }
.mt-2 { margin-top: 0.5rem; }
.mt-3 { margin-top: 0.75rem; }
.mt-4 { margin-top: 1rem; }
.mt-6 { margin-top: 1.5rem; }
.mb-4 { margin-bottom: 1rem; }
.ml-2 { margin-left: 0.5rem; }
.text-center { text-align: center; }

/* Responsive adjustments */
@media (max-width: 868px) {
    .exam-room-body {
        grid-template-columns: 1fr;
    }
    .main-navbar {
        padding: 0.85rem 1rem;
    }
    .portal-container {
        padding: 1.5rem 1rem;
    }
}

/* Print Stylesheet for Official Certificates */
@media print {
    body * {
        visibility: hidden;
    }
    #certificate-print-area, #certificate-print-area * {
        visibility: visible;
    }
    #certificate-print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff !important;
        color: #000 !important;
    }
    .certificate-border {
        border-color: #000 !important;
        background: #fff !important;
    }
    .certificate-inner {
        border-color: #666 !important;
    }
    .cert-main-title {
        color: #000 !important;
    }
    .cert-recipient {
        color: #000 !important;
    }
}

    getAll(collection) {
        return this.data[collection] || [];
    }

    getById(collection, id) {
        const items = this.getAll(collection);
        return items.find(item => item.id === id) || null;
    }

    insert(collection, item) {
        if (!this.data[collection]) {
            this.data[collection] = [];
        }
        if (!item.id) {
            item.id = 'gen_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        }
        if (!item.createdAt) {
            item.createdAt = new Date().toISOString();
        }
        this.data[collection].push(item);
        this.save();
        return item;
    }

    update(collection, id, updates) {
        const items = this.getAll(collection);
        const index = items.findIndex(item => item.id === id);
        if (index !== -1) {
            this.data[collection][index] = {
                ...this.data[collection][index],
                ...updates,
                updatedAt: new Date().toISOString()
            };
            this.save();
            return this.data[collection][index];
        }
        return null;
    }

    delete(collection, id) {
        const items = this.getAll(collection);
        const index = items.findIndex(item => item.id === id);
        if (index !== -1) {
            const removed = this.data[collection].splice(index, 1);
            this.save();
            return removed[0];
        }
        return null;
    }

    logActivity(actor, action, details) {
        const log = {
            id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            timestamp: new Date().toISOString(),
            actor: actor || 'System',
            action: action,
            details: details
        };
        this.data.auditLogs.unshift(log);
        if (this.data.auditLogs.length > 200) {
            this.data.auditLogs.pop();
        }
        this.save();
        return log;
    }

    getUserByEmail(email) {
        return this.data.users.find(u => u.email.toLowerCase() === email.toLowerCase()) || null;
    }

    getExamsByTeacher(teacherId) {
        return this.data.exams.filter(e => e.teacherId === teacherId);
    }

    getQuestionsBySubject(subjectId) {
        return this.data.questions.filter(q => q.subjectId === subjectId);
    }

    getSubmissionsByStudent(studentId) {
        return this.data.submissions.filter(s => s.studentId === studentId);
    }

    getSubmissionsByExam(examId) {
        return this.data.submissions.filter(s => s.examId === examId);
    }

    getExamQuestions(examId) {
        const exam = this.getById('exams', examId);
        if (!exam || !exam.questions) return [];
        return exam.questions.map(qId => this.getById('questions', qId)).filter(Boolean);
    }

    exportJSON() {
        return JSON.stringify(this.data, null, 2);
    }

    importJSON(jsonString) {
        try {
            const parsed = JSON.parse(jsonString);
            if (!parsed.users || !parsed.exams) {
                throw new Error("Invalid ExamFlow database format.");
            }
            this.data = parsed;
            this.save();
            return { success: true, message: "Database imported successfully." };
        } catch (e) {
            return { success: false, message: e.message };
        }
    }

    resetDefaults() {
        localStorage.removeItem(this.STORAGE_KEY);
        this.seed();
        return { success: true, message: "Database reset to factory seeds." };
    }
}

/* ==========================================================================
   2. AUTHENTICATION CONTROLLER
   ========================================================================== */
class AuthManager {
    constructor() {
        this.SESSION_KEY = 'EXAMFLOW_ACTIVE_SESSION';
        this.currentUser = null;
        this.init();
    }

    init() {
        const storedSession = localStorage.getItem(this.SESSION_KEY);
        if (storedSession) {
            try {
                const userObj = JSON.parse(storedSession);
                const dbUser = window.db.getById('users', userObj.id);
                if (dbUser && dbUser.status === 'active') {
                    this.currentUser = dbUser;
                } else {
                    this.logout();
                }
            } catch (e) {
                this.logout();
            }
        }
    }

    getCurrentUser() {
        return this.currentUser;
    }

    isAuthenticated() {
        return this.currentUser !== null;
    }

    getRole() {
        return this.currentUser ? this.currentUser.role : null;
    }

    login(email, password) {
        if (!email || !password) {
            return { success: false, message: 'Please enter both email and password.' };
        }

        const user = window.db.getUserByEmail(email.trim());
        if (!user) {
            return { success: false, message: 'No account found with this email address.' };
        }

        if (user.status !== 'active') {
            return { success: false, message: 'This account has been suspended or deactivated.' };
        }

        if (user.password !== password.trim()) {
            return { success: false, message: 'Incorrect password. Please try again.' };
        }

        this.currentUser = user;
        localStorage.setItem(this.SESSION_KEY, JSON.stringify(user));
        
        window.db.logActivity(user.name, 'USER_LOGIN', `User ${user.name} (${user.role}) logged in successfully.`);
        
        return { success: true, user: user };
    }

    register(data) {
        const { name, email, password, role, department, rollNumber, studentClass } = data;

        if (!name || !email || !password || !role) {
            return { success: false, message: 'Please fill in all mandatory fields.' };
        }

        if (window.db.getUserByEmail(email)) {
            return { success: false, message: 'An account with this email already exists.' };
        }

        const avatarColors = ['#6366f1', '#ec4899', '#8b5cf6', '#10b981', '#f59e0b', '#06b6d4'];
        const randomColor = avatarColors[Math.floor(Math.random() * avatarColors.length)];

        const newUser = {
            id: 'usr_' + Date.now(),
            name: name.trim(),
            email: email.trim().toLowerCase(),
            password: password.trim(),
            role: role,
            department: department || 'General Studies',
            rollNumber: rollNumber || (role === 'student' ? 'STU-' + Math.floor(1000 + Math.random() * 9000) : undefined),
            studentClass: role === 'student' ? (studentClass ? studentClass.trim() : 'General Class') : undefined,
            avatar: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=${randomColor.replace('#', '')}`,
            status: 'active',
            createdAt: new Date().toISOString()
        };

        window.db.insert('users', newUser);
        window.db.logActivity(newUser.name, 'USER_REGISTER', `New ${role} registered: ${newUser.name}`);

        this.currentUser = newUser;
        localStorage.setItem(this.SESSION_KEY, JSON.stringify(newUser));

        return { success: true, user: newUser };
    }

    logout() {
        if (this.currentUser) {
            window.db.logActivity(this.currentUser.name, 'USER_LOGOUT', `User logged out.`);
        }
        this.currentUser = null;
        localStorage.removeItem(this.SESSION_KEY);
    }
}

        this.currentTab = tab;
        this.render();
    }

    renderActiveTab(users, exams, subjects, submissions, logs, stats) {
        switch (this.currentTab) {
            case 'overview':
                return this.renderOverviewTab(stats, exams, submissions, logs);
            case 'users':
                return this.renderUsersTab(users);
            case 'exams':
                return this.renderExamsTab(exams, subjects, users);
            case 'subjects':
                return this.renderSubjectsTab(subjects);
            case 'logs':

            default:
                return '';
        }
    }

    handleRoleChange(role) {
        const deptLabel = document.querySelector('#dept-field label');
        const classField = document.getElementById('class-field');
        if (deptLabel) {
            deptLabel.textContent = role === 'student' ? 'Roll Number / Student ID' : 'Department / Faculty';
        }
        if (classField) {
            classField.style.display = role === 'student' ? 'block' : 'none';
        }
    }

    handleCreateUser(e) {
        e.preventDefault();
        const name = document.getElementById('new-user-name').value;
        const email = document.getElementById('new-user-email').value;
        const password = document.getElementById('new-user-password').value;
        const role = document.getElementById('new-user-role').value;
        const dept = document.getElementById('new-user-dept').value;
        const studentClass = document.getElementById('new-user-class') ? document.getElementById('new-user-class').value : '';

        if (window.db.getUserByEmail(email)) {
            window.app.showToast('User with this email already exists!', 'error');
            return;
        }

        const newUser = {
            id: 'usr_' + Date.now(),
            name: name.trim(),
            email: email.trim().toLowerCase(),
            password: password.trim(),
            role: role,
            department: role !== 'student' ? dept : undefined,
            rollNumber: role === 'student' ? dept : undefined,
            studentClass: role === 'student' ? (studentClass ? studentClass.trim() : 'General Class') : undefined,
            avatar: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}`,
            status: 'active',
            createdAt: new Date().toISOString()
        };

        window.db.insert('users', newUser);
        window.db.logActivity(window.auth.getCurrentUser().name, 'USER_CREATED', `Admin created ${role} account for ${name}`);
        window.app.closeModal('admin-user-modal');
        window.app.showToast(`User ${name} created successfully!`, 'success');
        this.render();
    }

    toggleUserStatus(userId) {
        const user = window.db.getById('users', userId);
        if (!user) return;
        const newStatus = user.status === 'active' ? 'suspended' : 'active';
        window.db.update('users', userId, { status: newStatus });
        window.db.logActivity(window.auth.getCurrentUser().name, 'USER_STATUS_UPDATE', `Changed ${user.name} status to ${newStatus}`);
        window.app.showToast(`User ${user.name} is now ${newStatus}.`, 'info');
        this.render();
    }

    deleteUser(userId, userName) {
        if (!confirm(`Are you sure you want to permanently delete user "${userName}"?`)) return;
        window.db.delete('users', userId);
        window.db.logActivity(window.auth.getCurrentUser().name, 'USER_DELETED', `Deleted user account: ${userName}`);
        window.app.showToast(`User ${userName} deleted.`, 'success');
        this.render();
    }

    toggleExamStatus(examId) {
        const exam = window.db.getById('exams', examId);

        window.app.showToast(`Exam is now ${newStatus}.`, 'info');
        this.render();

        const json = window.db.exportJSON();

                                📥 Download DB Backup (JSON)
                            </button>
                            <label class="btn btn-secondary file-upload-btn">

                                <input type="file" id="db-file-input" accept=".json" onchange="window.adminCtrl.handleImportFile(event)" style="display:none;">

                            <textarea class="form-input code-box" rows="10" readonly>${json}</textarea>
                        </div>
                    </div>
                    <div class="modal-footer">

        `;

    downloadBackupFile() {
        const json = window.db.exportJSON();
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `examflow-database-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        window.app.showToast('Database downloaded as JSON!', 'success');
    }

    handleImportFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const res = window.db.importJSON(event.target.result);
            if (res.success) {
                window.app.showToast('Database successfully imported!', 'success');
                window.app.closeModal('admin-backup-modal');
                window.app.renderCurrentView();
            } else {
                window.app.showToast('Import failed: ' + res.message, 'error');
            }
        };
        reader.readAsText(file);
    }

    resetDatabase() {
        if (confirm("Reset ALL data back to default factory demo records? Any custom data will be cleared.")) {
            window.db.resetDefaults();
            window.app.closeModal('admin-backup-modal');
            window.app.showToast('Database reset to defaults.', 'info');
            window.app.renderCurrentView();
        }
    }

    filterUsers(query) {
        const q = query.toLowerCase();
        const rows = document.querySelectorAll('#users-table tbody tr');
        rows.forEach(r => {
            const text = r.textContent.toLowerCase();
            r.style.display = text.includes(q) ? '' : 'none';
        });
    }
}

window.adminCtrl = new AdminController();
