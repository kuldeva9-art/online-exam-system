class TeacherController {
    constructor() {
        this.currentTab = 'exams';
        this.wizardData = {
            step: 1,
            title: '',
            subjectId: '',
            description: '',
            durationMinutes: 30,
            passPercentage: 60,
            tabSwitchLimit: 3,
            shuffleQuestions: true,
            allowReview: true,
            selectedQuestions: []
        };
    }

    render() {
        const container = document.getElementById('teacher-content-area');
        if (!container) return;

        const user = window.auth.getCurrentUser();
        const exams = window.db.getExamsByTeacher(user.id);
        const allQuestions = window.db.getAll('questions').filter(q => q.teacherId === user.id || !q.teacherId);
        
        const myExamIds = exams.map(e => e.id);
        const mySubmissions = window.db.getAll('submissions').filter(s => myExamIds.includes(s.examId));

        let avgScore = 0;
        if (mySubmissions.length > 0) {
            const sum = mySubmissions.reduce((acc, curr) => acc + (curr.percentage || 0), 0);
            avgScore = Math.round(sum / mySubmissions.length);
        }

        container.innerHTML = `
            <div class="portal-header">
                <div>
                    <h1 class="portal-title">Instructor Portal</h1>
                    <p class="portal-subtitle">Welcome back, ${user.name}. Manage your assessments, questions, and student evaluations.</p>
                </div>
                <div class="portal-actions">
                    <button class="btn btn-secondary btn-sm" onclick="window.teacherCtrl.openExcelImportModal()">
                        <span class="icon">📊</span> Bulk Upload Excel/CSV
                    </button>
                    <button class="btn btn-secondary btn-sm" onclick="window.teacherCtrl.openQuestionModal()">
                        <span class="icon">❓</span> Add Question
                    </button>
                    <button class="btn btn-primary btn-sm" onclick="window.teacherCtrl.startExamWizard()">
                        <span class="icon">✨</span> Create New Exam
                    </button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon bg-indigo">📝</div>
                    <div class="stat-info">
                        <div class="stat-value">${exams.length}</div>
                        <div class="stat-label">Exams Created</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-cyan">❓</div>
                    <div class="stat-info">
                        <div class="stat-value">${allQuestions.length}</div>
                        <div class="stat-label">Question Bank Items</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-emerald">🎓</div>
                    <div class="stat-info">
                        <div class="stat-value">${mySubmissions.length}</div>
                        <div class="stat-label">Student Submissions</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-amber">📊</div>
                    <div class="stat-info">
                        <div class="stat-value">${avgScore}%</div>
                        <div class="stat-label">Class Average Score</div>
                    </div>
                </div>
            </div>

            <div class="tabs-nav mt-6">
                <button class="tab-btn ${this.currentTab === 'exams' ? 'active' : ''}" onclick="window.teacherCtrl.switchTab('exams')">
                    📋 My Exams (${exams.length})
                </button>
                <button class="tab-btn ${this.currentTab === 'questions' ? 'active' : ''}" onclick="window.teacherCtrl.switchTab('questions')">
                    🗃️ Question Bank (${allQuestions.length})
                </button>
                <button class="tab-btn ${this.currentTab === 'submissions' ? 'active' : ''}" onclick="window.teacherCtrl.switchTab('submissions')">
                    📈 Results & Submissions (${mySubmissions.length})
                </button>
            </div>

            <div class="tab-pane">
                ${this.renderActiveTab(exams, allQuestions, mySubmissions)}
            </div>
        `;
    }

    switchTab(tab) {
        this.currentTab = tab;
        this.render();
    }

    renderActiveTab(exams, questions, submissions) {
        switch (this.currentTab) {
            case 'exams':
                return this.renderExamsTab(exams);
            case 'questions':
                return this.renderQuestionsTab(questions);
            case 'submissions':
                return this.renderSubmissionsTab(submissions);
            default:
                return '';
        }
    }

    renderExamsTab(exams) {
        if (exams.length === 0) {
            return `
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <h3>No exams created yet</h3>
                    <p class="text-muted">Launch your first online test in minutes using our step-by-step exam builder wizard.</p>
                    <button class="btn btn-primary mt-4" onclick="window.teacherCtrl.startExamWizard()">Create First Exam</button>
                </div>
            `;
        }

        return `
            <div class="exams-grid">
                ${exams.map(e => {
                    const subject = window.db.getById('subjects', e.subjectId);
                    const subCount = window.db.getSubmissionsByExam(e.id).length;
                    return `
                        <div class="exam-card">
                            <div class="exam-card-badge">
                                <span class="subject-tag">${subject ? subject.name : 'General'}</span>
                                <span class="badge ${e.status === 'published' ? 'badge-success' : 'badge-warning'}">
                                    ${e.status.toUpperCase()}
                                </span>
                            </div>
                            <h3 class="exam-card-title">${e.title}</h3>
                            <p class="exam-card-desc">${e.description || 'No description provided.'}</p>
                            
                            <div class="exam-card-meta">
                                <div>⏱️ ${e.durationMinutes} mins</div>
                                <div>❓ ${(e.questions || []).length} questions</div>
                                <div>🏆 ${e.totalMarks} pts (${e.passPercentage}% pass)</div>
                                <div>🛡️ ${e.tabSwitchLimit} max tab exits</div>
                            </div>

                            <div class="exam-card-footer">
                                <div class="text-xs text-muted"><strong>${subCount}</strong> submissions</div>
                                <div class="exam-card-actions">
                                    <button class="btn btn-ghost btn-xs" onclick="window.teacherCtrl.togglePublish('${e.id}')">
                                        ${e.status === 'published' ? 'Unpublish' : 'Publish'}
                                    </button>
                                    <button class="btn btn-ghost-danger btn-xs" onclick="window.teacherCtrl.deleteExam('${e.id}')">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    renderQuestionsTab(questions) {
        const subjects = window.db.getAll('subjects');
        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3 class="card-title">Question Repository</h3>
                        <p class="card-subtitle">Manage multiple-choice, true/false, and open-ended question assets.</p>
                    </div>
                    <div class="filters-row">
                        <button class="btn btn-secondary btn-sm" onclick="window.teacherCtrl.downloadQuestionTemplate()">
                            <span class="icon">📥</span> Excel Template
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="window.teacherCtrl.openExcelImportModal()">
                            <span class="icon">📊</span> Bulk Upload Excel/CSV
                        </button>
                        <select id="filter-subject" class="form-input form-input-sm" onchange="window.teacherCtrl.filterQuestions()">
                            <option value="">All Subjects</option>
                            ${subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                        </select>
                        <select id="filter-type" class="form-input form-input-sm" onchange="window.teacherCtrl.filterQuestions()">
                            <option value="">All Question Types</option>
                            <option value="mcq">Single-Choice (MCQ)</option>
                            <option value="multi">Multiple-Choice</option>
                            <option value="tf">True / False</option>
                            <option value="short">Short Answer</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="questions-list" id="questions-container">
                        ${questions.map((q, idx) => this.renderQuestionItem(q, idx)).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    renderQuestionItem(q, idx) {
        const subject = window.db.getById('subjects', q.subjectId);
        const typeLabels = {
            'mcq': 'Single Choice',
            'multi': 'Multi-Select',
            'tf': 'True / False',
            'short': 'Short Answer'
        };

        return `
            <div class="question-item" data-subject="${q.subjectId}" data-type="${q.type}">
                <div class="question-header">
                    <div class="question-badges">
                        <span class="badge badge-indigo">Q${idx + 1}</span>
                        <span class="badge badge-secondary">${typeLabels[q.type] || q.type}</span>
                        <span class="badge badge-info">${subject ? subject.name : 'General'}</span>
                        <span class="badge badge-amber">${q.points} pt${q.points > 1 ? 's' : ''}</span>
                    </div>
                    <button class="btn btn-ghost-danger btn-xs" onclick="window.teacherCtrl.deleteQuestion('${q.id}')">Delete</button>
                </div>
                <div class="question-text">${q.text}</div>
                
                ${q.options && q.options.length > 0 ? `
                    <div class="options-preview">
                        ${q.options.map((opt, i) => {
                            const isCorrect = (q.correctAnswers || []).includes(i);
                            return `
                                <div class="option-pill ${isCorrect ? 'correct' : ''}">
                                    <span class="opt-label">${String.fromCharCode(65 + i)}:</span>
                                    <span>${opt}</span>
                                    ${isCorrect ? '<span class="check-icon">✓</span>' : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : ''}

                ${q.type === 'short' ? `
                    <div class="text-xs text-muted mt-2">
                        <strong>Accepted keywords:</strong> ${(q.correctAnswers || []).join(', ')}
                    </div>
                ` : ''}

                ${q.explanation ? `
                    <div class="question-explanation">
                        💡 <strong>Explanation:</strong> ${q.explanation}
                    </div>
                ` : ''}
            </div>
        `;
    }

    renderSubmissionsTab(submissions) {
        if (submissions.length === 0) {
            return `
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <h3>No student submissions yet</h3>
                    <p class="text-muted">Once students complete your published exams, their live scorecards and responses will appear here.</p>
                </div>
            `;
        }

        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3 class="card-title">Student Submissions & Scorecards</h3>
                        <p class="card-subtitle">Review individual student answer papers, audit integrity logs, and export performance data.</p>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="window.teacherCtrl.exportResultsCSV()">
                        📥 Export CSV
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>Exam Title</th>
                                    <th>Score / Total</th>
                                    <th>Percentage</th>
                                    <th>Status</th>
                                    <th>Time Spent</th>
                                    <th>Warnings</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${submissions.map(s => {
                                    const exam = window.db.getById('exams', s.examId);
                                    const mins = Math.floor((s.timeSpentSeconds || 0) / 60);
                                    const secs = (s.timeSpentSeconds || 0) % 60;
                                    return `
                                        <tr>
                                            <td>
                                                <div class="user-cell">
                                                    <div class="user-name">${s.studentName}</div>
                                                    <div class="user-sub">${s.studentEmail}</div>
                                                </div>
                                            </td>
                                            <td>${exam ? exam.title : 'Exam'}</td>
                                            <td><strong>${s.score} / ${s.totalMarks}</strong></td>
                                            <td>
                                                <div class="progress-container">
                                                    <div class="progress-bar ${s.percentage >= 60 ? 'bg-success' : 'bg-danger'}" style="width: ${s.percentage}%"></div>
                                                </div>
                                                <span class="text-xs">${s.percentage}%</span>
                                            </td>
                                            <td>
                                                <span class="badge ${s.status === 'passed' ? 'badge-success' : 'badge-danger'}">
                                                    ${s.status.toUpperCase()}
                                                </span>
                                            </td>
                                            <td>${mins}m ${secs}s</td>
                                            <td>
                                                <span class="badge ${s.warningsCount > 0 ? 'badge-warning' : 'badge-secondary'}">
                                                    ${s.warningsCount || 0} alerts
                                                </span>
                                            </td>
                                            <td>
                                                <button class="btn btn-primary btn-xs" onclick="window.teacherCtrl.viewSubmissionDetails('${s.id}')">
                                                    🔍 Review Paper
                                                </button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    startExamWizard() {
        this.wizardData = {
            step: 1,
            title: '',
            subjectId: '',
            description: '',
            durationMinutes: 30,
            passPercentage: 60,
            tabSwitchLimit: 3,
            shuffleQuestions: true,
            allowReview: true,
            selectedQuestions: []
        };
        this.renderWizardModal();
    }

    renderWizardModal() {
        const subjects = window.db.getAll('subjects');
        const allQuestions = window.db.getAll('questions');

        let stepContent = '';

        if (this.wizardData.step === 1) {
            stepContent = `
                <h4 class="step-title">Step 1: Exam Basic Information</h4>
                <div class="form-group">
                    <label class="form-label">Exam Title *</label>
                    <input type="text" id="wiz-title" class="form-input" value="${this.wizardData.title}" placeholder="e.g. Midterm Assessment 2026" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Subject Domain *</label>
                    <select id="wiz-subject" class="form-input" required>
                        <option value="">-- Select Subject --</option>
                        ${subjects.map(s => `<option value="${s.id}" ${this.wizardData.subjectId === s.id ? 'selected' : ''}>${s.name} (${s.code})</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description / Instructions</label>
                    <textarea id="wiz-desc" class="form-input" rows="3" placeholder="Guidelines for test candidates...">${this.wizardData.description}</textarea>
                </div>
                <div class="grid-2col">
                    <div class="form-group">
                        <label class="form-label">Time Duration (Minutes)</label>
                        <input type="number" id="wiz-duration" class="form-input" min="5" max="180" value="${this.wizardData.durationMinutes}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Pass Percentage (%)</label>
                        <input type="number" id="wiz-pass" class="form-input" min="10" max="100" value="${this.wizardData.passPercentage}">
                    </div>
                </div>
            `;
        } else if (this.wizardData.step === 2) {
            const filteredQ = this.wizardData.subjectId 
                ? allQuestions.filter(q => q.subjectId === this.wizardData.subjectId)
                : allQuestions;

            stepContent = `
                <div class="wizard-step-header">
                    <div>
                        <h4 class="step-title">Step 2: Select Questions</h4>
                        <p class="text-sm text-muted">Pick questions from your repository. Selected: <strong>${this.wizardData.selectedQuestions.length}</strong></p>
                    </div>
                    <button class="btn btn-secondary btn-xs" onclick="window.teacherCtrl.selectAllWizardQuestions(true)">Select All</button>
                </div>

                ${filteredQ.length === 0 ? `
                    <div class="empty-state">
                        <p>No questions found in this subject. Create questions in the Question Bank first!</p>
                    </div>
                ` : `
                    <div class="wizard-questions-list">
                        ${filteredQ.map(q => {
                            const isChecked = this.wizardData.selectedQuestions.includes(q.id);
                            return `
                                <label class="wizard-q-item ${isChecked ? 'selected' : ''}">
                                    <input type="checkbox" value="${q.id}" ${isChecked ? 'checked' : ''} onchange="window.teacherCtrl.toggleWizardQuestion('${q.id}')">
                                    <div class="wizard-q-content">
                                        <div class="wizard-q-text">${q.text}</div>
                                        <div class="text-xs text-muted mt-1">
                                            Type: ${q.type.toUpperCase()} | Points: ${q.points} pt${q.points > 1 ? 's' : ''}
                                        </div>
                                    </div>
                                </label>
                            `;
                        }).join('')}
                    </div>
                `}
            `;
        } else if (this.wizardData.step === 3) {
            stepContent = `
                <h4 class="step-title">Step 3: Proctoring & Security Settings</h4>
                
                <div class="form-group">
                    <label class="form-label">Tab Switch & Focus Violation Limit</label>
                    <input type="number" id="wiz-tablimit" class="form-input" min="1" max="10" value="${this.wizardData.tabSwitchLimit}">
                    <span class="form-hint">Number of tab switches allowed before auto-submitting the exam.</span>
                </div>

                <div class="checkbox-card mt-3">
                    <label class="checkbox-label">
                        <input type="checkbox" id="wiz-shuffle" ${this.wizardData.shuffleQuestions ? 'checked' : ''}>
                        <div>
                            <strong>Randomize Question Order</strong>
                            <div class="text-xs text-muted">Shuffle question order uniquely for each candidate.</div>
                        </div>
                    </label>
                </div>

                <div class="checkbox-card mt-3">
                    <label class="checkbox-label">
                        <input type="checkbox" id="wiz-review" ${this.wizardData.allowReview ? 'checked' : ''}>
                        <div>
                            <strong>Allow Instant Result & Explanation Review</strong>
                            <div class="text-xs text-muted">Candidate can inspect detailed answers and explanations upon submission.</div>
                        </div>
                    </label>
                </div>
            `;
        } else if (this.wizardData.step === 4) {
            const subject = window.db.getById('subjects', this.wizardData.subjectId);
            const questions = this.wizardData.selectedQuestions.map(id => window.db.getById('questions', id)).filter(Boolean);
            const totalPoints = questions.reduce((sum, q) => sum + (q.points || 1), 0);

            stepContent = `
                <h4 class="step-title">Step 4: Review & Publish</h4>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>Title:</span>
                        <strong>${this.wizardData.title}</strong>
                    </div>
                    <div class="summary-row">
                        <span>Subject:</span>
                        <strong>${subject ? subject.name : 'N/A'}</strong>
                    </div>
                    <div class="summary-row">
                        <span>Duration:</span>
                        <strong>${this.wizardData.durationMinutes} minutes</strong>
                    </div>
                    <div class="summary-row">
                        <span>Questions Selected:</span>
                        <strong>${questions.length} questions</strong>
                    </div>
                    <div class="summary-row">
                        <span>Total Points:</span>
                        <strong>${totalPoints} pts</strong>
                    </div>
                    <div class="summary-row">
                        <span>Pass Mark:</span>
                        <strong>${this.wizardData.passPercentage}% (${Math.ceil(totalPoints * (this.wizardData.passPercentage / 100))} pts)</strong>
                    </div>
                    <div class="summary-row">
                        <span>Anti-Cheat Tab Limit:</span>
                        <strong>${this.wizardData.tabSwitchLimit} violations</strong>
                    </div>
                </div>
            `;
        }

        const modalHtml = `
            <div class="modal-backdrop" id="teacher-wizard-modal">
                <div class="modal-card modal-lg">
                    <div class="modal-header">
                        <h3 class="modal-title">✨ Create Online Exam (Step ${this.wizardData.step} of 4)</h3>
                        <button class="modal-close" onclick="window.app.closeModal('teacher-wizard-modal')">&times;</button>
                    </div>
                    <div class="wizard-stepper">
                        <div class="step-dot ${this.wizardData.step >= 1 ? 'active' : ''}">1. Basics</div>
                        <div class="step-line ${this.wizardData.step >= 2 ? 'active' : ''}"></div>
                        <div class="step-dot ${this.wizardData.step >= 2 ? 'active' : ''}">2. Questions</div>
                        <div class="step-line ${this.wizardData.step >= 3 ? 'active' : ''}"></div>
                        <div class="step-dot ${this.wizardData.step >= 3 ? 'active' : ''}">3. Proctoring</div>
                        <div class="step-line ${this.wizardData.step >= 4 ? 'active' : ''}"></div>
                        <div class="step-dot ${this.wizardData.step >= 4 ? 'active' : ''}">4. Launch</div>
                    </div>
                    <div class="modal-body">
                        ${stepContent}
                    </div>
                    <div class="modal-footer">
                        ${this.wizardData.step > 1 ? `
                            <button type="button" class="btn btn-secondary" onclick="window.teacherCtrl.prevWizardStep()">Back</button>
                        ` : `
                            <button type="button" class="btn btn-secondary" onclick="window.app.closeModal('teacher-wizard-modal')">Cancel</button>
                        `}
                        ${this.wizardData.step < 4 ? `
                            <button type="button" class="btn btn-primary" onclick="window.teacherCtrl.nextWizardStep()">Continue</button>
                        ` : `
                            <button type="button" class="btn btn-success" onclick="window.teacherCtrl.finishWizard(true)">🚀 Publish Exam</button>
                            <button type="button" class="btn btn-secondary" onclick="window.teacherCtrl.finishWizard(false)">Save as Draft</button>
                        `}
                    </div>
                </div>
            </div>
        `;
        window.app.openModal(modalHtml);
    }

    nextWizardStep() {
        if (this.wizardData.step === 1) {
            const title = document.getElementById('wiz-title').value.trim();
            const subjectId = document.getElementById('wiz-subject').value;
            const desc = document.getElementById('wiz-desc').value.trim();
            const duration = parseInt(document.getElementById('wiz-duration').value) || 30;
            const pass = parseInt(document.getElementById('wiz-pass').value) || 60;

            if (!title) {
                window.app.showToast('Please enter an exam title.', 'error');
                return;
            }
            if (!subjectId) {
                window.app.showToast('Please select a subject.', 'error');
                return;
            }

            this.wizardData.title = title;
            this.wizardData.subjectId = subjectId;
            this.wizardData.description = desc;
            this.wizardData.durationMinutes = duration;
            this.wizardData.passPercentage = pass;
        } else if (this.wizardData.step === 2) {
            if (this.wizardData.selectedQuestions.length === 0) {
                window.app.showToast('Please select at least 1 question for this exam.', 'error');
                return;
            }
        } else if (this.wizardData.step === 3) {
            this.wizardData.tabSwitchLimit = parseInt(document.getElementById('wiz-tablimit').value) || 3;
            this.wizardData.shuffleQuestions = document.getElementById('wiz-shuffle').checked;
            this.wizardData.allowReview = document.getElementById('wiz-review').checked;
        }

        this.wizardData.step++;
        this.renderWizardModal();
    }

    prevWizardStep() {
        if (this.wizardData.step > 1) {
            this.wizardData.step--;
            this.renderWizardModal();
        }
    }

    toggleWizardQuestion(qId) {
        const idx = this.wizardData.selectedQuestions.indexOf(qId);
        if (idx !== -1) {
            this.wizardData.selectedQuestions.splice(idx, 1);
        } else {
            this.wizardData.selectedQuestions.push(qId);
        }
        this.renderWizardModal();
    }

    selectAllWizardQuestions(select) {
        const allQuestions = window.db.getAll('questions');
        const filteredQ = this.wizardData.subjectId 
            ? allQuestions.filter(q => q.subjectId === this.wizardData.subjectId)
            : allQuestions;

        if (select) {
            this.wizardData.selectedQuestions = filteredQ.map(q => q.id);
        } else {
            this.wizardData.selectedQuestions = [];
        }
        this.renderWizardModal();
    }

    finishWizard(publishImmediately) {
        const user = window.auth.getCurrentUser();

    handleCreateQuestion(e) {
        e.preventDefault();
        const user = window.auth.getCurrentUser();
        const subjectId = document.getElementById('q-subject').value;
        const type = document.getElementById('q-type').value;
        const text = document.getElementById('q-text').value.trim();
        const points = parseInt(document.getElementById('q-points').value) || 1;
        const difficulty = document.getElementById('q-difficulty').value;
        const explanation = document.getElementById('q-explanation').value.trim();

        let options = [];
        let correctAnswers = [];

        if (type === 'mcq') {
            const inputs = document.querySelectorAll('.opt-val');
            inputs.forEach(inp => {
                if (inp.value.trim()) options.push(inp.value.trim());
            });
            const checked = document.querySelector('input[name="mcq-correct"]:checked');
            correctAnswers = [checked ? parseInt(checked.value) : 0];
        } else if (type === 'multi') {
            const inputs = document.querySelectorAll('.opt-val');
            inputs.forEach(inp => {
                if (inp.value.trim()) options.push(inp.value.trim());
            });
            const checks = document.querySelectorAll('.multi-correct:checked');
            checks.forEach(c => correctAnswers.push(parseInt(c.value)));
        } else if (type === 'tf') {
            options = ['True', 'False'];
            const checked = document.querySelector('input[name="tf-correct"]:checked');
            correctAnswers = [checked ? parseInt(checked.value) : 0];
        } else if (type === 'short') {
            options = [];
            const rawKeys = document.getElementById('q-short-keys').value;
            correctAnswers = rawKeys.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        }

        const newQuestion = {
            id: 'q_' + Date.now(),
            subjectId,
            teacherId: user.id,
            type,
            text,
            options,
            correctAnswers,
            explanation,
            points,
            difficulty,
            createdAt: new Date().toISOString()
        };

        window.db.insert('questions', newQuestion);
        window.app.closeModal('teacher-question-modal');
        window.app.showToast('Question added to bank!', 'success');
        this.render();
    }

    formatAnswer(ans, question) {
        if (ans === undefined || ans === null || ans === '') return '<em class="text-muted">No Answer Given</em>';
        if (question.type === 'short') return ans.toString();
        if (question.type === 'tf') {
            const idx = Array.isArray(ans) ? ans[0] : ans;
            return idx === 0 ? 'True' : 'False';
        }
        if (Array.isArray(ans)) {
            return ans.map(idx => `${String.fromCharCode(65 + idx)}: ${question.options[idx] || ''}`).join(', ');
        }
        return ans;
    }

    parseCSV(text) {
        const lines = [];
        let curLine = [];
        let curVal = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            const nextC = text[i + 1];

            if (c === '"') {
                if (inQuotes && nextC === '"') {
                    curVal += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if ((c === ',' || c === '\t') && !inQuotes) {
                curLine.push(curVal.trim());
                curVal = '';
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && nextC === '\n') i++;
                curLine.push(curVal.trim());
                if (curLine.some(cell => cell.length > 0)) {
                    lines.push(curLine);
                }
                curLine = [];
                curVal = '';
            } else {
                curVal += c;
            }
        }
        if (curVal.length > 0 || curLine.length > 0) {
            curLine.push(curVal.trim());
            lines.push(curLine);
        }
        return lines;
    }

    parseCSVToQuestions(csvText) {
        const rows = this.parseCSV(csvText);
        if (rows.length < 2) return [];

        const header = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
        
        const colSubject = header.findIndex(h => h.includes('subject'));
        const colType = header.findIndex(h => h.includes('type'));
        const colText = header.findIndex(h => h.includes('question') || h.includes('text') || h.includes('prompt'));
        const colOptA = header.findIndex(h => h.includes('optiona') || h.includes('opta'));
        const colOptB = header.findIndex(h => h.includes('optionb') || h.includes('optb'));
        const colOptC = header.findIndex(h => h.includes('optionc') || h.includes('optc'));
        const colOptD = header.findIndex(h => h.includes('optiond') || h.includes('optd'));
        const colAns = header.findIndex(h => h.includes('correct') || h.includes('answer') || h.includes('key'));
        const colPts = header.findIndex(h => h.includes('point') || h.includes('mark'));
        const colDiff = header.findIndex(h => h.includes('diff'));
        const colExp = header.findIndex(h => h.includes('explain') || h.includes('solution'));

        const subjects = window.db.getAll('subjects');
        const defaultSubEl = document.getElementById('import-default-subject');
        const defaultSubId = defaultSubEl ? defaultSubEl.value : (subjects[0] ? subjects[0].id : '');

        const results = [];

        for (let r = 1; r < rows.length; r++) {
            const row = rows[r];
            if (row.length === 0 || !row.some(cell => cell.length > 0)) continue;

            const rawSub = colSubject !== -1 && row[colSubject] ? row[colSubject].trim() : '';
            const rawType = colType !== -1 && row[colType] ? row[colType].trim().toLowerCase() : 'mcq';
            const qText = colText !== -1 && row[colText] ? row[colText].trim() : (row[0] || '');
            const optA = colOptA !== -1 && row[colOptA] ? row[colOptA].trim() : '';
            const optB = colOptB !== -1 && row[colOptB] ? row[colOptB].trim() : '';
            const optC = colOptC !== -1 && row[colOptC] ? row[colOptC].trim() : '';
            const optD = colOptD !== -1 && row[colOptD] ? row[colOptD].trim() : '';
            const rawAns = colAns !== -1 && row[colAns] ? row[colAns].trim() : '';
            const pts = colPts !== -1 && row[colPts] ? parseInt(row[colPts]) || 1 : 1;
            const diff = colDiff !== -1 && row[colDiff] ? row[colDiff].trim().toLowerCase() : 'medium';
            const exp = colExp !== -1 && row[colExp] ? row[colExp].trim() : '';

            let matchedSub = subjects.find(s => s.code.toLowerCase() === rawSub.toLowerCase() || s.name.toLowerCase() === rawSub.toLowerCase() || s.id === rawSub);
            const subjectId = matchedSub ? matchedSub.id : defaultSubId;
            const subjectName = matchedSub ? matchedSub.name : (window.db.getById('subjects', defaultSubId) ? window.db.getById('subjects', defaultSubId).name : 'General');

            let type = 'mcq';
            if (rawType.includes('multi') || rawType.includes('checkbox')) type = 'multi';
            else if (rawType.includes('tf') || rawType.includes('true') || rawType.includes('boolean')) type = 'tf';
            else if (rawType.includes('short') || rawType.includes('text')) type = 'short';

            let options = [];
            let correctAnswers = [];
            let isValid = true;
            let errorMsg = '';

            if (!qText) {
                isValid = false;
                errorMsg = 'Missing Question Text';
            }

            if (type === 'mcq' || type === 'multi') {
                options = [optA, optB, optC, optD].filter(Boolean);
                if (options.length < 2) {
                    isValid = false;
                    errorMsg = 'Requires at least 2 options';
                }
            } else if (type === 'tf') {
                options = ['True', 'False'];
            }

            if (isValid) {
                if (type === 'mcq') {
                    const mapLetter = { 'a': 0, 'b': 1, 'c': 2, 'd': 3, '1': 0, '2': 1, '3': 2, '4': 3, '0': 0 };
                    const normAns = rawAns.toLowerCase();
                    if (mapLetter[normAns] !== undefined && mapLetter[normAns] < options.length) {
                        correctAnswers = [mapLetter[normAns]];
                    } else {
                        const matchedIdx = options.findIndex(o => o.toLowerCase() === normAns);
                        if (matchedIdx !== -1) {
                            correctAnswers = [matchedIdx];
                        } else {
                            correctAnswers = [0];
                        }
                    }
                } else if (type === 'multi') {
                    const parts = rawAns.split(/[,;\s/]+/).map(p => p.trim().toLowerCase()).filter(Boolean);
                    const mapLetter = { 'a': 0, 'b': 1, 'c': 2, 'd': 3, '1': 0, '2': 1, '3': 2, '4': 3, '0': 0 };
                    parts.forEach(p => {
                        if (mapLetter[p] !== undefined && mapLetter[p] < options.length) {
                            correctAnswers.push(mapLetter[p]);
                        } else {
                            const matchedIdx = options.findIndex(o => o.toLowerCase() === p);
                            if (matchedIdx !== -1) correctAnswers.push(matchedIdx);
                        }
                    });
                    if (correctAnswers.length === 0) correctAnswers = [0];
                } else if (type === 'tf') {
                    const normAns = rawAns.toLowerCase();
                    if (normAns === 'true' || normAns === 't' || normAns === 'a' || normAns === '0') {
                        correctAnswers = [0];
                    } else {
                        correctAnswers = [1];
                    }
                } else if (type === 'short') {
                    correctAnswers = rawAns.split(/[,;]+/).map(k => k.trim().toLowerCase()).filter(Boolean);
                    if (correctAnswers.length === 0) correctAnswers = [rawAns.toLowerCase()];
                }
            }

            results.push({
                subjectId,
                subjectName,
                type,
                text: qText,
                options,
                correctAnswers,
                explanation: exp,
                points: pts,
                difficulty: diff,
                isValid,
                errorMsg
            });
        }

        return results;
    }

    renderPreviewTable(parsed) {
        const area = document.getElementById('excel-preview-area');
        const tbody = document.getElementById('preview-table-body');
        const btnConfirm = document.getElementById('btn-confirm-import');

        if (!area || !tbody) return;

        area.style.display = 'block';
        const validCount = parsed.filter(p => p.isValid).length;

        tbody.innerHTML = parsed.map((item, idx) => `
            <tr class="${item.isValid ? '' : 'table-danger'}">
                <td>${idx + 1}</td>
                <td><span class="badge badge-info">${item.subjectName}</span></td>
                <td><span class="badge badge-secondary">${item.type.toUpperCase()}</span></td>
                <td><strong>${item.text}</strong></td>
                <td><span class="text-xs text-success">${JSON.stringify(item.correctAnswers)}</span></td>
                <td>${item.points} pt${item.points > 1 ? 's' : ''}</td>
                <td>
                    <span class="badge ${item.isValid ? 'badge-success' : 'badge-danger'}">
                        ${item.isValid ? 'Valid ✓' : 'Invalid: ' + item.errorMsg}
                    </span>
                </td>
            </tr>
        `).join('');

        if (btnConfirm) {
            btnConfirm.disabled = validCount === 0;
            btnConfirm.textContent = `🚀 Confirm & Import ${validCount} Questions`;
        }
    }

    confirmImport() {
        const user = window.auth.getCurrentUser();
        const validItems = (this.parsedQuestionsToImport || []).filter(p => p.isValid);

        if (validItems.length === 0) {
            window.app.showToast('No valid questions to import.', 'error');
            return;
        }

        let count = 0;
        validItems.forEach(item => {
            const newQuestion = {
                id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                subjectId: item.subjectId,
                teacherId: user.id,
                type: item.type,
                text: item.text,
                options: item.options,
                correctAnswers: item.correctAnswers,
                explanation: item.explanation,
                points: item.points,
                difficulty: item.difficulty,
                createdAt: new Date().toISOString()
            };
            window.db.insert('questions', newQuestion);
            count++;
        });

        window.db.logActivity(user.name, 'QUESTIONS_IMPORTED', `Bulk imported ${count} questions via Excel/CSV`);
        window.app.closeModal('teacher-excel-modal');
        window.app.showToast(`Successfully imported ${count} questions into Question Bank!`, 'success');
        this.render();
    }
}

    renderQuestionInput(q) {
        const studentAns = this.answers[q.id];

        if (q.type === 'mcq') {
            return `
                <div class="options-container">
                    ${(q.options || []).map((opt, i) => {
                        const isSelected = studentAns && studentAns[0] === i;
                        return `
                            <label class="option-choice-card ${isSelected ? 'selected' : ''}" onclick="window.studentCtrl.selectOption(${i})">
                                <input type="radio" name="live_q_opt" value="${i}" ${isSelected ? 'checked' : ''}>
                                <span class="choice-prefix">${String.fromCharCode(65 + i)}</span>
                                <span class="choice-text">${opt}</span>
                            </label>
                        `;
                    }).join('')}
                </div>
            `;
        } else if (q.type === 'multi') {
            const selArr = Array.isArray(studentAns) ? studentAns : [];
            return `
                <div class="options-container">
                    ${(q.options || []).map((opt, i) => {
                        const isSelected = selArr.includes(i);
                        return `
                            <label class="option-choice-card ${isSelected ? 'selected' : ''}" onclick="window.studentCtrl.toggleMultiOption(${i})">
                                <input type="checkbox" name="live_q_multi" value="${i}" ${isSelected ? 'checked' : ''}>
                                <span class="choice-prefix">${String.fromCharCode(65 + i)}</span>
                                <span class="choice-text">${opt}</span>
                            </label>
                        `;
                    }).join('')}
                </div>
            `;
        } else if (q.type === 'tf') {
            const isTrue = studentAns && studentAns[0] === 0;
            const isFalse = studentAns && studentAns[0] === 1;
            return `
                <div class="tf-choices-grid">
                    <button type="button" class="tf-btn ${isTrue ? 'selected' : ''}" onclick="window.studentCtrl.selectOption(0)">
                        <span class="tf-icon">✓</span>
                        <span>True</span>
                    </button>
                    <button type="button" class="tf-btn ${isFalse ? 'selected' : ''}" onclick="window.studentCtrl.selectOption(1)">
                        <span class="tf-icon">✗</span>
                        <span>False</span>
                    </button>
                </div>
            `;
        } else if (q.type === 'short') {
            return `
                <div class="short-answer-box">
                    <label class="form-label">Your Response:</label>
                    <textarea class="form-input" rows="4" placeholder="Type your answer here..." oninput="window.studentCtrl.setShortAnswer(this.value)">${studentAns || ''}</textarea>
                </div>
            `;
        }
        return '';
    }

    selectOption(index) {
        const currentQ = this.questions[this.currentQuestionIndex];
        this.answers[currentQ.id] = [index];
        this.renderLiveExamRoom();
    }

    toggleMultiOption(index) {
        const currentQ = this.questions[this.currentQuestionIndex];
        let current = this.answers[currentQ.id] || [];
        if (!Array.isArray(current)) current = [];
        
        if (current.includes(index)) {
            current = current.filter(i => i !== index);
        } else {
            current.push(index);
        }
        this.answers[currentQ.id] = current;
        this.renderLiveExamRoom();
    }

    setShortAnswer(val) {
        const currentQ = this.questions[this.currentQuestionIndex];
        this.answers[currentQ.id] = val;
    }

    clearAnswer() {
        const currentQ = this.questions[this.currentQuestionIndex];
        delete this.answers[currentQ.id];
        this.renderLiveExamRoom();
    }

    toggleReviewFlag() {
        const currentQ = this.questions[this.currentQuestionIndex];
        this.reviewFlags[currentQ.id] = !this.reviewFlags[currentQ.id];
        this.renderLiveExamRoom();
    }

    goToQuestion(index) {
        if (index >= 0 && index < this.questions.length) {
            this.currentQuestionIndex = index;
            this.renderLiveExamRoom();
        }
    }

    navigateQuestion(direction) {
        const target = this.currentQuestionIndex + direction;
        if (target >= 0 && target < this.questions.length) {
            this.currentQuestionIndex = target;
            this.renderLiveExamRoom();
        }
    }

    startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);

        this.timerInterval = setInterval(() => {
            this.timeRemainingSeconds--;
            
            const timerEl = document.getElementById('timer-text');
            if (timerEl) {
                timerEl.textContent = this.formatTime(this.timeRemainingSeconds);
                if (this.timeRemainingSeconds <= 300) {
                    timerEl.classList.add('timer-danger');
                }
            }

            if (this.timeRemainingSeconds <= 0) {
                clearInterval(this.timerInterval);
                window.app.showToast('Time has expired! Submitting your assessment...', 'warning');
                this.executeAutoSubmission('TIME_EXPIRED');
            }
        }, 1000);
    }

    setupProctoring() {
        this.visibilityHandler = () => {
            if (document.hidden && this.activeExam) {
                this.handleFocusViolation();
            }
        };
        document.addEventListener('visibilitychange', this.visibilityHandler);

        this.blurHandler = () => {
            if (this.activeExam) {
                this.handleFocusViolation();
            }
        };
        window.addEventListener('blur', this.blurHandler);
    }

    handleFocusViolation() {
        this.warningCount++;
        const limit = this.activeExam ? this.activeExam.tabSwitchLimit : 3;

        const warningBanner = document.getElementById('proctor-warning-banner');
        if (warningBanner) {
            warningBanner.style.display = 'flex';
            warningBanner.innerHTML = `⚠️ <strong>Security Violation (${this.warningCount} / ${limit}):</strong> Window focus lost or tab switched! You will be auto-submitted if you exceed the limit.`;
        }

        window.app.showToast(`Warning ${this.warningCount}/${limit}: Exam tab switch detected!`, 'error');

        if (this.warningCount >= limit) {
            window.app.showToast('Anti-cheating violation threshold exceeded! Exam auto-submitting now...', 'error');
            this.executeAutoSubmission('VIOLATION_THRESHOLD_EXCEEDED');
        }
    }

    cleanUpProctoring() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        document.removeEventListener('visibilitychange', this.visibilityHandler);
        window.removeEventListener('blur', this.blurHandler);

        if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
    }

    formatTime(seconds) {
        if (seconds < 0) seconds = 0;
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    confirmSubmitExam() {
        const answeredCount = Object.keys(this.answers).filter(k => {
            const val = this.answers[k];
            return val !== undefined && val !== null && val !== '' && (!Array.isArray(val) || val.length > 0);
        }).length;
        const total = this.questions.length;
        const unanswered = total - answeredCount;
        const flaggedCount = Object.values(this.reviewFlags).filter(Boolean).length;

        const modalHtml = `
            <div class="modal-backdrop" id="student-submit-modal">
                <div class="modal-card">
                    <div class="modal-header">
                        <h3 class="modal-title">Confirm Exam Submission</h3>

                    <div class="modal-body">
                        <p>Are you sure you want to finish and submit your exam paper?</p>
                        <div class="summary-box mt-3">

                                <span>Total Questions:</span>
                                <strong>${total}</strong>
                            </div>
                            <div class="summary-row">
                                <span>Answered:</span>
                                <strong class="text-success">${answeredCount}</strong>
                            </div>
                            <div class="summary-row">
                                <span>Unanswered:</span>
                                <strong class="text-danger">${unanswered}</strong>
                            </div>

                                <strong class="text-warning">${flaggedCount}</strong>
                            </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="window.app.closeModal('student-submit-modal')">Resume Test</button>

                            Yes, Final Submit 🚀
                        </button>
                    </div>
                </div>
            </div>
        `;
        window.app.openModal(modalHtml);
    }

    executeManualSubmission() {
        window.app.closeModal('student-submit-modal');
        this.executeAutoSubmission('NORMAL_SUBMISSION');
    }

    executeAutoSubmission(reason) {
        this.cleanUpProctoring();
        const user = window.auth.getCurrentUser();
        const exam = this.activeExam;
        if (!exam) return;

        let earnedScore = 0;
        let totalPossibleScore = 0;

        this.questions.forEach(q => {
            const points = q.points || 1;
            totalPossibleScore += points;
            const studentAns = this.answers[q.id];

            if (studentAns !== undefined && studentAns !== null) {
                if (q.type === 'mcq' || q.type === 'tf') {
                    if (studentAns[0] === q.correctAnswers[0]) {
                        earnedScore += points;
                    }
                } else if (q.type === 'multi') {
                    const sortedStudent = studentAns.slice().sort();
                    const sortedCorrect = q.correctAnswers.slice().sort();
                    if (JSON.stringify(sortedStudent) === JSON.stringify(sortedCorrect)) {
                        earnedScore += points;
                    }
                } else if (q.type === 'short') {
                    const txt = studentAns.toString().trim().toLowerCase();
                    const isMatch = q.correctAnswers.some(k => txt.includes(k.toLowerCase()));
                    if (isMatch) {
                        earnedScore += points;
                    }
                }
            }
        });

        const percentage = totalPossibleScore > 0 ? Math.round((earnedScore / totalPossibleScore) * 100) : 0;
        const status = percentage >= exam.passPercentage ? 'passed' : 'failed';
        const timeSpent = Math.max(1, Math.round((Date.now() - this.startTime) / 1000));

        const submission = {
            id: 'subm_' + Date.now(),
            examId: exam.id,
            studentId: user.id,
            studentName: user.name,
            studentEmail: user.email,
            answers: this.answers,
            score: earnedScore,
            totalMarks: totalPossibleScore,
            percentage: percentage,
            status: status,
            warningsCount: this.warningCount,
            timeSpentSeconds: timeSpent,
            submissionReason: reason,
            submittedAt: new Date().toISOString()
        };

        window.db.insert('submissions', submission);
        window.db.logActivity(user.name, 'EXAM_SUBMITTED', `Completed "${exam.title}" with score ${earnedScore}/${totalPossibleScore} (${percentage}%) - ${status.toUpperCase()}`);

        this.activeExam = null;
        window.app.showView('student-portal');
        this.render();

        this.showScorecardModal(submission, exam);
    }

class App {
    constructor() {
        this.currentView = 'auth-view';
        this.init();
    }

    init() {
        document.addEventListener('DOMContentLoaded', () => {
            this.setupEventListeners();
            this.renderCurrentView();
        });
    }

    setupEventListeners() {
        const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => this.handleLogin(e));
        }

        const registerForm = document.getElementById('register-form');
        if (registerForm) {
            registerForm.addEventListener('submit', (e) => this.handleRegister(e));
        }
    }

    renderCurrentView() {
        const user = window.auth.getCurrentUser();
        const navContainer = document.getElementById('main-nav');
        const views = document.querySelectorAll('.app-view');

        views.forEach(v => v.classList.remove('active'));

        if (!user) {
            this.showView('auth-view');
            if (navContainer) navContainer.style.display = 'none';
            return;
        }

        if (navContainer) {
            navContainer.style.display = 'flex';
            this.renderNavBar(user);
        }

        if (user.role === 'admin') {
            this.showView('admin-portal');
            window.adminCtrl.render();
        } else if (user.role === 'teacher') {
            this.showView('teacher-portal');
            window.teacherCtrl.render();
        } else if (user.role === 'student') {
            this.showView('student-portal');
            window.studentCtrl.render();
        }
    }

    showView(viewId) {
        this.currentView = viewId;
        const views = document.querySelectorAll('.app-view');
        views.forEach(v => {
            if (v.id === viewId) {
                v.classList.add('active');
            } else {
                v.classList.remove('active');
            }
        });

        const navContainer = document.getElementById('main-nav');
        if (navContainer) {
            navContainer.style.display = viewId === 'live-exam-room' ? 'none' : 'flex';
        }
    }

    renderNavBar(user) {
        const navRight = document.getElementById('nav-user-area');
        if (!navRight) return;

        const roleBadges = {
            admin: '<span class="badge badge-primary">Administrator</span>',
            teacher: '<span class="badge badge-success">Instructor</span>',
            student: '<span class="badge badge-indigo">Student</span>'
        };

        navRight.innerHTML = `
            <div class="user-profile-menu">
                <img src="${user.avatar || 'https://api.dicebear.com/7.x/initials/svg?seed=' + user.name}" class="avatar-sm" alt="${user.name}">
                <div class="user-info-text">
                    <div class="user-name-text">${user.name}</div>
                    <div class="user-role-badge">${roleBadges[user.role] || user.role}</div>
                </div>
                <button class="btn btn-ghost-danger btn-xs" onclick="window.app.handleLogout()" title="Log out">
                    🚪 Logout
                </button>
            </div>
        `;
    }

    handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;

        const res = window.auth.login(email, pass);
        if (res.success) {
            this.showToast(`Welcome back, ${res.user.name}!`, 'success');
            this.renderCurrentView();
        } else {
            this.showToast(res.message, 'error');
        }
    }

    handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const role = document.getElementById('reg-role').value;
        const extra = document.getElementById('reg-extra').value;
        const studentClass = document.getElementById('reg-class') ? document.getElementById('reg-class').value : '';

        const res = window.auth.register({
            name,
            email,
            password,
            role,
            department: role === 'teacher' ? extra : undefined,
            rollNumber: role === 'student' ? extra : undefined,
            studentClass: role === 'student' ? studentClass : undefined
        });

        if (res.success) {
            this.showToast(`Account created! Welcome, ${res.user.name}`, 'success');
            this.renderCurrentView();
        } else {
            this.showToast(res.message, 'error');
        }
    }

    handleLogout() {
        window.auth.logout();
        this.showToast('You have been logged out.', 'info');
        this.renderCurrentView();
    }

    switchAuthTab(tab) {
        const loginTab = document.getElementById('auth-tab-login');
        const regTab = document.getElementById('auth-tab-register');
        const loginForm = document.getElementById('login-form-container');
        const regForm = document.getElementById('register-form-container');

        if (tab === 'login') {
            loginTab.classList.add('active');
            regTab.classList.remove('active');
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
        } else {
            regTab.classList.add('active');
            loginTab.classList.remove('active');
            regForm.style.display = 'block';
            loginForm.style.display = 'none';
        }
    }

    onRoleSelectChange(role) {
        const label = document.getElementById('reg-extra-label');
        const input = document.getElementById('reg-extra');
        const classGroup = document.getElementById('reg-class-group');
        const classInput = document.getElementById('reg-class');

        if (role === 'teacher') {
            label.textContent = 'Faculty / Department';
            input.placeholder = 'e.g. Department of Computer Science';
            if (classGroup) classGroup.style.display = 'none';
            if (classInput) classInput.removeAttribute('required');
        } else {
            label.textContent = 'Roll Number / Student ID';
            input.placeholder = 'e.g. CS-2026-088';
            if (classGroup) classGroup.style.display = 'block';
            if (classInput) classInput.setAttribute('required', 'required');
        }
    }

    showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        
        const icons = {
            success: '✅',
            error: '❌',
            warning: '⚠️',
            info: 'ℹ️'
        };

        toast.innerHTML = `
            <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
            <span class="toast-message">${message}</span>
        `;

        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 400);
        }, 3500);
    }

    openModal(html) {
        const existing = document.getElementById('global-modal-root');
        if (existing) existing.innerHTML = html;
        else {
            const div = document.createElement('div');
            div.id = 'global-modal-root';
            div.innerHTML = html;
            document.body.appendChild(div);
        }
    }

    closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.remove();
    }
}

        const app = initializeApp(firebaseConfig);
        const cloudDB = getFirestore(app);

        // वेबसाईट लोड झाल्यावर Firebase शी कनेक्ट करण्याची सिस्टीम
        setTimeout(async () => {
            if(window.db) {
                console.log("Global Server शी कनेक्ट होत आहे...");

                // १. Firebase वरून सगळा डेटा 'वाचून' (Read) सर्व विद्यार्थ्यांपर्यंत पोहोचवणे
                const collectionsToSync = ['users', 'exams', 'questions', 'submissions', 'subjects'];
                let dataUpdated = false;

                for(let colName of collectionsToSync) {
                    try {
                        const snap = await getDocs(collection(cloudDB, colName));
                        if(!snap.empty) {
                            if(!window.db.data[colName]) window.db.data[colName] = [];
                            
                            snap.forEach(docSnap => {
                                const cloudData = docSnap.data();
                                const localIndex = window.db.data[colName].findIndex(x => x.id === cloudData.id);
                                
                                if(localIndex === -1) {
                                    window.db.data[colName].push(cloudData); // नवीन डेटा ऍड करणे
                                    dataUpdated = true;
                                } else {
                                    window.db.data[colName][localIndex] = cloudData; // जुना डेटा अपडेट करणे
                                }
                            });
                        }
                    } catch(e) { console.error("डेटा सिंक करताना एरर: ", e); }
                }

                // जर नवीन डेटा आला असेल तर स्क्रीन रिफ्रेश करणे
                if(dataUpdated) {
                    window.db.save(); 
                    if(window.app) window.app.renderCurrentView();
                    console.log("ग्लोबल डेटा यशस्वीरित्या सिंक झाला!");
                }

                // २. नवीन तयार केलेला डेटा थेट Firebase वर 'पाठवणे' (Write)
                const originalInsert = window.db.insert.bind(window.db);
                window.db.insert = function(colName, item) {
                    const result = originalInsert(colName, item);
                    setDoc(doc(cloudDB, colName, result.id), result).catch(e=>console.log(e)); // क्लाउडवर सेव्ह
                    return result;
                };

                const originalUpdate = window.db.update.bind(window.db);
                window.db.update = function(colName, id, updates) {
                    const result = originalUpdate(colName, id, updates);
                    if(result) {
                        setDoc(doc(cloudDB, colName, id), result, {merge: true}).catch(e=>console.log(e));
                    }
                    return result;
                };

                const originalDelete = window.db.delete.bind(window.db);
                window.db.delete = function(colName, id) {
                    const result = originalDelete(colName, id);
                    if(result) {
                        deleteDoc(doc(cloudDB, colName, id)).catch(e=>console.log(e));
                    }
                    return result;
                };
            }
        }, 1200); // वेबसाईट लोड झाल्यानंतर १ सेकंदाने डेटा कनेक्ट होईल
    </script>
</body>
</html>
